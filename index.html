<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>for my favorite idiot ♡</title>

  <link rel="stylesheet" href="style.css">


  <!-- GOOGLE FONTS -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=VT323&display=swap" rel="stylesheet">

</head>

<body>


  <!-- COZY GLOW -->

  <div class="glow"></div>


  <!-- PAPER TEXTURE -->

  <div class="texture"></div>


  <!-- FLOATING STARS -->

  <img src="assets/Star.png" class="star star1">

  <img src="assets/Star.png" class="star star2">


  <!-- POMODORO BUTTON -->

  <a 
  href="https://aarushisharmap18-lgtm.github.io/lock-in-timer/"
  target="_blank"
  class="pomodoro-btn">

  pomodoro 💗

  </a>


  <!-- TITLE -->

  <h1 class="title">

    go study idiot ♡

  </h1>


  <!-- SUBTITLE -->

  <p class="subtitle">

    your future self will be proud of you ♡

  </p>


  <!-- SCRAPBOOK SECTION -->

  <div class="scrapbook">


    <!-- POLAROID -->

    <div class="polaroid">

      <img src="assets/cute-figure.png" class="polaroid-img">

      <p>

        player 1: exhausted student

      </p>

      <img src="assets/Tape.png" class="tape">

    </div>



    <!-- RIGHT SIDE COLUMN -->

    <div class="right-column">


      <!-- STICKY NOTE -->

      <div class="note">

        drink water pls.
        <br>
        also stop overthinking.

      </div>


      <!-- QUOTES -->

      <div class="quote-stack">

        <img src="assets/quote-1.jpg" class="small-quote">

        <img src="assets/quote-2.jpg" class="small-quote">

      </div>

    </div>

  </div>


  <!-- QUEST PANEL -->

  <div class="quest-panel">

    <h2>MAIN QUESTS</h2>

    <ul>

      <li>☐ finish how much ever you can</li>

      <li>☐ Take deep breaths</li>

      <li>☐ sleep before 3am</li>

    </ul>


    <!-- XP BAR -->

    <div class="xp-bar">

      <div class="xp-fill"></div>

    </div>

    <p class="xp-text">

      motivation level: 100%

    </p>

  </div>


  <!-- JAVASCRIPT -->

  <script src="script.js"></script>

</body>

</html>
